name: Daily Memecoin Scan

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    name: Memecoin Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Ensure reports directory
        run: mkdir -p reports

      - name: Run memecoin scanner
        run: python memecoin_scanner.py

      - name: Commit report to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "Kein neuer Report."
          else
            git commit -m "chore(reports): memecoin scan $(date -u '+%Y-%m-%d') [skip ci]"
            git push
          fi

      - name: Send Telegram notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets nicht gesetzt."
            exit 0
          fi
          if [ ! -f reports/telegram_message.txt ]; then
            echo "Keine Nachricht generiert."
            exit 0
          fi
          MSG_JSON=$(python3 -c "import json; print(json.dumps(open('reports/telegram_message.txt', encoding='utf-8').read()))")
          HTTP_CODE=$(curl -s -o /tmp/tg.json -w "%{http_code}" \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":${MSG_JSON},\"parse_mode\":\"HTML\",\"disable_web_page_preview\":false}")
          echo "Status: ${HTTP_CODE}"
          cat /tmp/tg.json
          [ "$HTTP_CODE" = "200" ] && echo "Telegram OK" || exit 1

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memecoin-report-${{ github.run_id }}
          path: reports/latest.md
          retention-days: 90
