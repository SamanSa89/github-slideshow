name: Daily Memecoin Scan

# DISCLAIMER: Informational report only. NOT financial advice.
# Memecoins are extremely high-risk. DYOR.

on:
  schedule:
    - cron: "0 8 * * *"   # täglich 08:00 UTC = 10:00 Uhr MEZ

  workflow_dispatch:       # manueller Start im GitHub Actions UI
    inputs:
      debug:
        description: "Verbose logging"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write

jobs:
  scan:
    name: Memecoin Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ─────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Dependencies ───────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ── 4. Reports-Verzeichnis ────────────────────────────────────────────
      - name: Ensure reports directory
        run: mkdir -p reports

      # ── 5. Scanner ausführen ──────────────────────────────────────────────
      - name: Run memecoin scanner
        env:
          PYTHONUNBUFFERED: "1"
        run: python memecoin_scanner.py

      # ── 6. Report committen ───────────────────────────────────────────────
      - name: Commit report to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "Kein neuer Report."
          else
            DATE="$(date -u '+%Y-%m-%d')"
            git commit -m "chore(reports): memecoin scan ${DATE} [skip ci]"
            git push
            echo "Report committed & pushed."
          fi

      # ── 7. Telegram-Benachrichtigung senden ───────────────────────────────
      - name: Send Telegram notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets nicht gesetzt — überspringe Benachrichtigung."
            exit 0
          fi

          if [ ! -f reports/telegram_message.txt ]; then
            echo "Keine Telegram-Nachricht generiert."
            exit 0
          fi

          # JSON-sicheres Encoding der Nachricht via Python
          MSG_JSON=$(python3 -c "
          import json, sys
          with open('reports/telegram_message.txt', 'r', encoding='utf-8') as f:
              print(json.dumps(f.read()))
          ")

          HTTP_CODE=$(curl -s -o /tmp/tg_response.json -w "%{http_code}" \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${TELEGRAM_CHAT_ID}\",
              \"text\": ${MSG_JSON},
              \"parse_mode\": \"HTML\",
              \"disable_web_page_preview\": false
            }")

          echo "Telegram API HTTP Status: ${HTTP_CODE}"
          cat /tmp/tg_response.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo "FEHLER: Telegram-Nachricht konnte nicht gesendet werden."
            exit 1
          fi

          echo "Telegram-Nachricht erfolgreich gesendet."

      # ── 8. Artifact hochladen (90 Tage) ──────────────────────────────────
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memecoin-report-${{ github.run_id }}
          path: |
            reports/latest.md
            reports/latest.json
          retention-days: 90
