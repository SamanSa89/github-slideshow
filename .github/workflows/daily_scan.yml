name: Daily Memecoin Scan

# ─────────────────────────────────────────────────────────────────────────────
# DISCLAIMER: This workflow generates an informational report only.
# Output is NOT financial advice. Memecoins are extremely high-risk.
# Always do your own research (DYOR). See memecoin_scanner.py for full disclaimer.
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Run every day at 08:00 UTC
  schedule:
    - cron: "0 8 * * *"

  # Allow manual triggering from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable verbose logging"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write   # needed to commit the generated report back to the repo

jobs:
  scan:
    name: Run Memecoin Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch with full depth so git log / blame work; token allows push
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Set up Python ─────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ──────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil

      # ── 4. Create reports directory ──────────────────────────────────────
      - name: Ensure reports directory exists
        run: mkdir -p reports

      # ── 5. Run the scanner ───────────────────────────────────────────────
      - name: Run memecoin scanner
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python memecoin_scanner.py

      # ── 6. Commit the generated report ───────────────────────────────────
      - name: Commit report to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage any new or updated report files
          git add reports/

          # Only commit if something actually changed
          if git diff --cached --quiet; then
            echo "No changes to commit — report already up to date."
          else
            DATE="$(date -u '+%Y-%m-%d')"
            git commit -m "chore(reports): add memecoin scan for ${DATE} [skip ci]"
            git push
            echo "Report committed and pushed."
          fi

      # ── 7. Upload report as Actions artifact (90-day retention) ──────────
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memecoin-report-${{ github.run_id }}
          path: |
            reports/latest.md
            reports/latest.json
          retention-days: 90
